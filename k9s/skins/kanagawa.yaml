# Kanagawa (wave) — default
# Styles...
foreground: &foreground "#DCD7BA"
background: &background "#1F1F28"
current_line: &current_line "#16161D"
selection: &selection "#43434C"
comment: &comment "#43434C"
black: &black "#16161D"
cyan: &cyan "#6A9589"
green: &green "#76946A"
blue: &blue "#7E9CD8"
magenta: &magenta "#957FB8"
red: &red "#C34043"
yellow: &yellow "#C0A36E"
white: &white "#C8C093"
bright_black: &bright_black "#727169"
bright_cyan: &bright_cyan "#7AA89F"
bright_green: &bright_green "#98BB6C"
bright_blue: &bright_blue "#7FB4CA"
bright_magenta: &bright_magenta "#938AA9"
bright_red: &bright_red "#E82424"
bright_yellow: &bright_yellow "#E6C394"
bright_white: &bright_white "#DCD7BA"

# Skin...
k9s:
  body:
    fgColor: *foreground
    bgColor: *background
    logoColor: *magenta
  prompt:
    fgColor: *foreground
    bgColor: *background
    suggestColor: *magenta
  info:
    fgColor: *bright_blue
    sectionColor: *foreground
  dialog:
    fgColor: *foreground
    bgColor: *background
    buttonFgColor: *foreground
    buttonBgColor: *magenta
    buttonFocusFgColor: *bright_yellow
    buttonFocusBgColor: *bright_blue
    labelFgColor: *white
    fieldFgColor: *foreground
  frame:
    border:
      fgColor: *selection
      focusColor: *current_line
    menu:
      fgColor: *foreground
      keyColor: *bright_blue
      numKeyColor: *bright_blue
    crumbs:
      fgColor: *foreground
      bgColor: *current_line
      activeColor: *current_line
    status:
      newColor: *bright_white
      modifyColor: *magenta
      addColor: *bright_green
      errorColor: *bright_red
      highlightColor: *white
      killColor: *comment
      completedColor: *comment
    title:
      fgColor: *foreground
      bgColor: *current_line
      highlightColor: *white
      counterColor: *magenta
      filterColor: *bright_blue
  views:
    charts:
      bgColor: default
      defaultDialColors:
        - *magenta
        - *bright_red
      defaultChartColors:
        - *magenta
        - *bright_red
    table:
      fgColor: *foreground
      bgColor: *background
      header:
        fgColor: *foreground
        bgColor: *background
        sorterColor: *bright_cyan
    xray:
      fgColor: *foreground
      bgColor: *background
      cursorColor: *current_line
      graphicColor: *magenta
      showIcons: false
    yaml:
      keyColor: *bright_blue
      colonColor: *magenta
      valueColor: *foreground
    logs:
      fgColor: *foreground
      bgColor: *background
      indicator:
        fgColor: *foreground
        bgColor: *magenta
        toggleOnColor: *bright_green
        toggleOffColor: *bright_blue
